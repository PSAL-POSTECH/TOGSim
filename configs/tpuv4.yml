# One TPU v4 TensorCore. The array unit TPUV4_MXU and the ISA's vcix_tpuv4 name a vcix model and compiler support
# that do not exist yet; vcix holds that model's keys once it states them.
num_cores: 1
core_freq_mhz: 1050
core_stats_print_period_cycles: 10000
num_systolic_array_per_core: 4
systolic_array_unit: TPUV4_MXU

vpu_num_lanes: 128
vpu_spad_size_kb_per_lane: 128

isa: [m, a, f, d, c, v, zvfh, zvfbfmin, zvl256b, vcix_tpuv4]
vcix: {}
address_map: {spad_vaddr: 0xd0000000, spad_paddr: 0x2000000000, dram_base: 0x80000000, dram_size: 107374182400}

dram_type: ramulator2
dram_freq_mhz: 1200
dram_channels: 16
dram_stats_print_period_cycles: 10000
ramulator_config_path: ../configs/ramulator2_configs/HBM2_TPUv4.yaml
l2d_type: datacache
l2d_config: S:128:128:512,32,L:T:m:W:L,A:192:4,32:0,32

icnt_type: simple
icnt_latency_cycles: 10
icnt_freq_mhz: 1050
icnt_injection_ports_per_core: 16
