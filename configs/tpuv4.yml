# One TPU v4 TensorCore. The array unit TPUV4_MXU.rows and the ISA's pytorchsim_tpuv4 name a vcix model and compiler support
# that do not exist yet; vcix holds that model's keys once it states them.
num_cores: 1
core_freq_mhz: 1050
core_stats_print_period_cycles: 10000
num_systolic_array_per_core: 4
systolic_array_unit: TPUV4_MXU.rows

vpu_num_lanes: 128
vpu_spad_size_kb_per_lane: 128

isa: [m, a, f, d, c, v, zvfh, zvfbfmin, zvl256b, pytorchsim_tpuv4, spad-vector-memory]
# The MXU's delay line, tpu_mxu_delay_cycles 75: libtpu 0.0.21's cost model puts a v4 vmatmul's first vpop 83 cycles
# after it (128x128), less the 8 cycles 8 rows take to enter an array of one register an operand and a row a cycle,
# as on libtpuv3.so. There is no v4 model to check it on, and no v4 hardware measurement backs it.
vcix: {tpu_mxu_delay_cycles: 75}
address_map: {spad_vaddr: 0x40000000, dram_base: 0x80000000, dram_size: 17179869184}

dram_type: ramulator2
dram_channels: 16
dram_stats_print_period_cycles: 10000
ramulator_config_path: ../configs/ramulator2_configs/HBM2_TPUv4.yaml
l2d_type: datacache
l2d_config: S:128:128:512,32,L:T:m:W:L,A:192:4,32:0,32

icnt_type: simple
icnt_latency_cycles: 10
icnt_freq_mhz: 1050
icnt_injection_ports_per_core: 16
