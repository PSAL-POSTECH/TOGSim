# tpuv3 with the BookSim2 interconnect. The array unit TPUV3_MXU.rows and the ISA's pytorchsim_tpuv3 name a vcix model and compiler support
# that do not exist yet; vcix holds that model's keys once it states them.
num_cores: 1
core_freq_mhz: 940
core_stats_print_period_cycles: 10000
num_systolic_array_per_core: 2
systolic_array_unit: TPUV3_MXU.rows

vpu_num_lanes: 128
vpu_spad_size_kb_per_lane: 128

isa: [m, a, f, d, c, v, zvfh, zvfbfmin, zvl256b, pytorchsim_tpuv3, spad-vector-memory]
vcix: {}
address_map: {spad_vaddr: 0x40000000, dram_base: 0x80000000, dram_size: 17179869184}

dram_type: ramulator2
dram_channels: 16
dram_stats_print_period_cycles: 10000
ramulator_config_path: ../configs/ramulator2_configs/HBM2_TPUv3.yaml

icnt_type: booksim2
icnt_freq_mhz: 940
icnt_injection_ports_per_core: 16
booksim_config_path: ../configs/booksim2_configs/fly_c16_m16.icnt
