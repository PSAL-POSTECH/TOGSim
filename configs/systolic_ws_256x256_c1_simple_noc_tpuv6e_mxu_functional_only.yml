# One TPU v6e TensorCore as libtpu drives it: two MXUs (mxu0/mxu1 in every LLO dump) of 256x256, vregs of 8 sublanes
# x 128 lanes x 32 bit, VMEM 134217728 B (the compile's vmem_report) = 1024 KB x 128 lanes. The array unit is Mxu,
# vcix-accelerator libtpu_mxu.so's port; at 1751 MHz its two 16-bit rows a cycle give 918 TFLOP/s over the two MXUs.
num_cores: 1
core_freq_mhz: 1751
core_stats_print_period_cycles: 200
num_systolic_array_per_core: 2
systolic_array_split: round_robin
systolic_array_unit: Mxu

vpu_num_lanes: 128
vpu_spad_size_kb_per_lane: 1024
vpu_vector_length_bits: 256
tpu_systolic_queue_entries: 256

dram_type: ramulator2
dram_channels: 32
dram_stats_print_period_cycles: 200
ramulator_config_path: ../configs/ramulator2_configs/HBM3_TPUv6e.yaml
l2d_type: datacache
l2d_config: S:128:128:512,32,L:T:m:W:L,A:192:4,32:0,32

icnt_type: simple
icnt_latency_cycles: 10
icnt_freq_mhz: 1751
icnt_injection_ports_per_core: 32

pytorchsim_functional_mode: 1
pytorchsim_timing_mode: 0

codegen_mapping_strategy: autotune
codegen_external_mapping_file: ''
codegen_autotune_max_retry: 10
codegen_autotune_template_topk: 4
codegen_compiler_optimization: all
